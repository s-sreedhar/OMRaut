[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omr-exam-app"
version = "0.1.0"
description = "Offline exam sheet generation, scanning, scoring, and analysis"
requires-python = ">=3.11,<3.14"
dependencies = ["PySide6>=6.7", "opencv-python>=4.9", "numpy>=1.26", "reportlab>=4.2", "jsonschema>=4.22", "openpyxl>=3.1", "PyMuPDF>=1.24", "velopack==1.2.161"]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pyinstaller>=6.8", "cryptography>=42"]

[project.scripts]
omr-exam = "omr_exam.app:main"
omr-harness = "omr_exam.harness:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
